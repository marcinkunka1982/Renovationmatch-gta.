<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Local Admin | RenovationMatch GTA</title><style>body{font:15px Arial;background:#f5f7f9;color:#223;margin:20px}main{max-width:1100px;margin:auto}input,button{padding:10px;margin:4px;border-radius:6px}button{background:#1264a3;color:white;border:0}section{background:white;padding:18px;margin:20px 0;border-radius:12px;overflow-x:auto}table{border-collapse:collapse;width:100%}td,th{padding:10px;border-bottom:1px solid #ddd;text-align:left}small{color:#555}</style><main><h1>RenovationMatch GTA · Local admin</h1><p><small>Development only. Do not expose this prototype publicly. Configure RM_ADMIN_TOKEN in your terminal before starting the server.</small></p><label>Admin token <input type="password" id="token" autocomplete="off"></label><button onclick="load()">Load records</button><p id="message" role="status"></p><section><h2>Leads</h2><div id="leads"></div></section><section><h2>Contractors</h2><div id="contractors"></div></section><section><h2>Assign an exclusive lead</h2><input id="lead" type="number" min="1" placeholder="Lead ID"><input id="contractor" type="number" min="1" placeholder="Contractor ID"><button onclick="assign()">Assign once</button><p>Assignment is permanent in this pilot. Repeated assignment attempts are rejected.</p></section></main><script>const msg=document.getElementById('message');function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}async function api(path,body){const r=await fetch(path,{method:body?'POST':'GET',headers:{'X-Admin-Token':document.getElementById('token').value,'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});const v=await r.json();if(!r.ok)throw Error(v.error||'Request failed');return v}function render(id,rows,keys){document.getElementById(id).innerHTML=rows.length?'<table><thead><tr>'+keys.map(k=>'<th>'+esc(k)+'</th>').join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+keys.map(k=>'<td>'+esc(r[k])+'</td>').join('')+'</tr>').join('')+'</tbody></table>':'No records yet.'}async function load(){try{const [a,b]=await Promise.all([api('/api/admin/leads'),api('/api/admin/contractors')]);render('leads',a.leads,['id','project_type','city','details','name','email','phone','status','assigned_contractor']);render('contractors',b.contractors,['id','business','contact','email','phone','services','cities','status']);msg.textContent='Loaded.'}catch(e){msg.textContent=e.message}}async function assign(){try{await api('/api/admin/assign',{lead_id:Number(document.getElementById('lead').value),contractor_id:Number(document.getElementById('contractor').value)});await load();msg.textContent='Assigned exclusively.'}catch(e){msg.textContent=e.message}}</script></html>
